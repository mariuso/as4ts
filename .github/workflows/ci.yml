name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      # Keep the streaming memory test fast on CI.
      AS4_LARGE_MB: 64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      # Audit what ships. The only advisory is a dev-only transitive (node-forge,
      # used to generate test fixtures / parse PKCS#12); see SECURITY.md.
      - run: npm run audit
